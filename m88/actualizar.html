<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow">
  <title>Actualizando M88…</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    main{text-align:center;max-width:420px}
    strong{color:#FFCD00}
    p{color:#aaa;line-height:1.55}
  </style>
</head>
<body>
  <main>
    <h1>Actualizando <strong>M88</strong>…</h1>
    <p>Limpiando la versión antigua del mapa comercial.</p>
  </main>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('constelacion8-shell-')).map(k=>caches.delete(k)));
        }
      }catch(e){ console.warn(e); }
      const target='/m88/?fresh='+Date.now();
      location.replace(target);
    })();
  </script>
</body>
</html>
