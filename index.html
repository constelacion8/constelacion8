<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ee">
<title>Constelación 8 — Prototipo</title>
<meta name="description" content="Personas relevantes de Canarias conectadas por isla, disciplina y época.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
<header>
  <div class="brand"><strong>CONSTELACIÓN 8</strong><span>personas · islas · conexiones</span></div>
  <button class="demo-btn" id="galdosDemo">Ver demo Galdós</button>
</header>
<div class="workspace">
  <main class="map-pane">
    <div class="map-top">
      <div>
        <div class="eyebrow">Mapa de Canarias</div>
        <div class="map-title" id="mapTitle">Ocho islas. Miles de historias conectadas.</div>
        <p class="map-sub" id="mapSub">Pulsa una isla para descubrir sus personas. Abre un perfil para ver cómo se conecta con el resto del archipiélago.</p>
      </div>
    </div>
    <div class="map-wrap" id="mapWrap">
      <img id="canaryMap" class="map-img" alt="Mapa del archipiélago canario">
      <svg id="network" viewBox="0 0 1000 474" preserveAspectRatio="none"></svg>
      <div id="profileNodes"></div>
    </div>
    <div class="legend" id="legend" hidden>
      <span><i style="background:var(--same-category)"></i>misma disciplina</span>
      <span><i style="background:var(--same-decade)"></i>misma década</span>
      <span><i style="background:var(--same-century)"></i>mismo siglo</span>
      <span><i style="background:var(--same-island)"></i>misma isla</span>
    </div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>
</div>
<script src="map-data.js"></script>
<script src="app.js"></script>
</body>
</html>
