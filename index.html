<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f2ee">
  <title>Constelación 8</title>
  <meta name="description" content="Personas relevantes de Canarias conectadas por territorio, disciplina y época.">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <button class="brand" id="homeButton" aria-label="Volver al inicio">
      <strong>CONSTELACIÓN 8</strong><span>personas · islas · conexiones</span>
    </button>
    <button class="demo-btn" id="galdosDemo">Ver constelación de Galdós</button>
  </header>

  <div class="workspace">
    <main class="map-pane">
      <div class="map-top">
        <div>
          <div class="eyebrow">Mapa de Canarias</div>
          <h1 class="map-title" id="mapTitle">Ocho islas. Miles de historias conectadas.</h1>
          <p class="map-sub" id="mapSub">Pulsa una isla para descubrir sus personas. Abre un perfil para explorar sus conexiones.</p>
        </div>
      </div>

      <div class="map-stage">
        <div class="map-wrap" id="mapWrap">
          <img
            id="canaryMap"
            class="map-img"
            src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Blank_Map-Canary_Islands.svg"
            alt="Mapa del archipiélago canario"
          >
          <svg id="network" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="profileNodes" aria-live="polite"></div>
        </div>
      </div>

      <div class="legend" id="legend" hidden>
        <span><i class="l-category"></i>misma disciplina</span>
        <span><i class="l-decade"></i>misma década</span>
        <span><i class="l-century"></i>mismo siglo</span>
        <span><i class="l-island"></i>misma isla</span>
      </div>
      <div class="map-credit">Base cartográfica: Wikimedia Commons · CC BY-SA.</div>
    </main>

    <aside class="panel" id="panel"></aside>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
