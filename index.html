<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Constelación 8</title>
  <meta name="description" content="Personas relevantes de Canarias conectadas por categoría y coincidencia vital.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <button class="brand" id="homeButton" aria-label="Volver al inicio">
      <strong>CONSTELACIÓN 8</strong>
      <span>personas · tiempo · conexiones</span>
    </button>
    <button class="demo-btn" id="moreraDemo">Ver una conexión</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">Cartografía humana de Canarias</div>
        <h1 id="mapTitle">Ocho islas.<br>Vidas que coincidieron.</h1>
        <p id="mapSub">Pulsa directamente sobre una isla. El mapa no necesita explicarse: debajo aparecerán sus personas y las conexiones que compartieron en el tiempo.</p>
      </div>

      <div class="map-stage">
        <div class="map-wrap" id="mapWrap">
          <img
            id="canaryMap"
            class="map-img"
            src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Blank_Map-Canary_Islands.svg"
            alt="Mapa del archipiélago canario"
          >
        </div>
      </div>
      <div class="map-credit">Base cartográfica: Wikimedia Commons · CC BY-SA.</div>
    </section>

    <section class="directory" id="directory" aria-live="polite"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
