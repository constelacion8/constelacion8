name: Capture municipal clean

on:
  push:
    branches: [main]
    paths:
      - 'm88/**'
      - '.github/workflows/capture-municipal-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture clean municipal map
        run: |
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000},deviceScaleFactor:1.5});
            await page.goto(`https://constelacion8.com/m88/?clean=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('.municipality-shape',{timeout:30000});
            const info=await page.evaluate(()=>({municipalities:document.querySelectorAll('.municipality-shape').length,boundaries:document.querySelectorAll('.municipality-boundary').length,visibleOutlines:[...document.querySelectorAll('.island-node.has-municipalities .island-shape')].map(el=>getComputedStyle(el).stroke)}));
            console.log('MAP_INFO',JSON.stringify(info));
            await page.locator('.archipelago-stage').screenshot({path:'municipal-clean-stage.png'});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: municipal-clean-capture
          path: municipal-clean-stage.png
          retention-days: 1
