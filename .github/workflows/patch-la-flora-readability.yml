name: Improve La Flora Bets readability
on:
  push:
    paths:
      - '.github/workflows/patch-la-flora-readability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase small text sizes
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('area-2627/index.html'); s=p.read_text(); css=base64.b64decode('').decode(); p.write_text(s.replace('</style>', css+'\n</style>', 1))"
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-la-flora-readability.yml
          git add area-2627/index.html
          git commit -m 'Increase La Flora Bets small-text readability'
          git push
