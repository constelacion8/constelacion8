name: Discover GC logo assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-gc-logo-assets.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official sites
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, html
          sites = {
            'ROQUE':'https://roqueaguayro.com/',
            'AET':'https://tejedanosmueve.es/',
            'ANDO':'https://andosataute.es/',
            'ASAMBLEA_VALSEQUILLERA':'https://asambleavalsequillera.org/',
            'BNR':'https://bloquenacionalistarural.org/',
            'AVESAN':'https://avesan2011.blogspot.com/',
            'MAS_TELDE':'https://www.masportelde.com/',
            'JPM':'https://transparencia.mogan.es/',
            'VPLURAL':'https://valsequilloplural.com/',
            'NC':'https://www.nuevacanariasbc.org/',
            'DRAGO':'https://www.dragocanarias.com/'
          }
          headers={'User-Agent':'Mozilla/5.0'}
          for name,url in sites.items():
            print('\n###',name,url)
            try:
              req=urllib.request.Request(url,headers=headers)
              text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
              text=html.unescape(text)
              candidates=[]
              # Link rel icons
              for m in re.finditer(r'<link[^>]+(?:rel=["\'][^"\']*(?:icon|apple-touch)[^"\']*["\'])[^>]*>',text,re.I):
                tag=m.group(0); hm=re.search(r'href=["\']([^"\']+)',tag,re.I)
                if hm:candidates.append(('ICON',hm.group(1)))
              # OG image
              for m in re.finditer(r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*>',text,re.I):
                tag=m.group(0); cm=re.search(r'content=["\']([^"\']+)',tag,re.I)
                if cm:candidates.append(('OG',cm.group(1)))
              # Images whose tag hints logo/brand
              for m in re.finditer(r'<img\b[^>]*>',text,re.I):
                tag=m.group(0)
                if re.search(r'logo|brand|cabecera|header',tag,re.I):
                  sm=re.search(r'(?:src|data-src)=["\']([^"\']+)',tag,re.I)
                  if sm:candidates.append(('IMG',sm.group(1)))
              # CSS background/url filenames containing logo
              for m in re.finditer(r'url\(["\']?([^\)"\']*(?:logo|brand)[^\)"\']*)',text,re.I):
                candidates.append(('CSS',m.group(1)))
              seen=set()
              for typ,asset in candidates:
                asset=asset.strip()
                if asset.startswith('//'): asset='https:'+asset
                elif not asset.startswith('http'): asset=urllib.parse.urljoin(url,asset)
                if asset not in seen:
                  seen.add(asset); print(typ,asset)
            except Exception as e:
              print('ERROR',repr(e))
          PY
