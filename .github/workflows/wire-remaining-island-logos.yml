name: Wire remaining island party logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-remaining-island-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add mappings and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('m88/app.js')
          text = app.read_text()
          if "./assets/parties/ahi.svg" not in text:
              block = r"""  {
    test: /agrupaci[oó]n herre[nñ]a independiente|\bahi\b/i,
    short: 'AHI',
    src: './assets/parties/ahi.svg'
  },
  {
    test: /agrupaci[oó]n socialista gomera|\basg\b/i,
    short: 'ASG',
    src: './assets/parties/asg.svg'
  },
  {
    test: /unidos por betancuria|\bupbe\b/i,
    short: 'UPBE',
    src: './assets/parties/upbe.svg'
  },
  {
    test: /unidos por yaiza|\bupy\b/i,
    short: 'UPY',
    src: './assets/parties/upy.jpg'
  },
"""
              marker = "const PARTY_MARKS = [\n"
              if marker not in text:
                  raise SystemExit('PARTY_MARKS marker not found')
              text = text.replace(marker, marker + block, 1)
              app.write_text(text)

          index = Path('m88/index.html')
          html = index.read_text()
          if re.search(r'app\.js\?v=[^\"\']+', html):
              html = re.sub(r'app\.js\?v=[^\"\']+', 'app.js?v=20260909-all-islands-1', html)
          elif 'app.js' in html:
              html = html.replace('app.js', 'app.js?v=20260909-all-islands-1', 1)
          else:
              raise SystemExit('app.js reference not found')
          index.write_text(html)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'constelacion8'
          git config user.email 'info@enriquerodda.com'
          git add m88/app.js m88/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Enable party logos across remaining islands'
            git push
          fi
