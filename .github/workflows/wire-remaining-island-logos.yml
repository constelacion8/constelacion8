name: Wire remaining island party logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-remaining-island-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add mappings and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('m88/app.js')
          text = app.read_text()
          if "./assets/parties/ahi.svg" not in text:
              block = (
                  "  {\n"
                  "    test: /agrupaci[oó]n herre[nñ]a independiente|\\bahi\\b/i,\n"
                  "    short: 'AHI',\n"
                  "    src: './assets/parties/ahi.svg'\n"
                  "  },\n"
                  "  {\n"
                  "    test: /agrupaci[oó]n socialista gomera|\\basg\\b/i,\n"
                  "    short: 'ASG',\n"
                  "    src: './assets/parties/asg.svg'\n"
                  "  },\n"
                  "  {\n"
                  "    test: /unidos por betancuria|\\bupbe\\b/i,\n"
                  "    short: 'UPBE',\n"
                  "    src: './assets/parties/upbe.svg'\n"
                  "  },\n"
                  "  {\n"
                  "    test: /unidos por yaiza|\\bupy\\b/i,\n"
                  "    short: 'UPY',\n"
                  "    src: './assets/parties/upy.jpg'\n"
                  "  },\n"
              )
              marker = "const PARTY_MARKS = [\n"
              if marker not in text:
                  raise SystemExit('PARTY_MARKS marker not found')
              text = text.replace(marker, marker + block, 1)
              app.write_text(text)

          index = Path('m88/index.html')
          html = index.read_text()
          html2, n = re.subn(r'app\.js(?:\?v=[^\"\']+)?', 'app.js?v=20260909-all-islands-1', html, count=1)
          if n != 1:
              raise SystemExit('app.js reference not found')
          index.write_text(html2)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'constelacion8'
          git config user.email 'info@enriquerodda.com'
          git add m88/app.js m88/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Enable party logos across remaining islands'
            git push
          fi
