name: Add La Flora tutorial and rules
on:
  push:
    paths:
      - '.github/workflows/patch-la-flora-tutorial.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add tutorial safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('area-2627/index.html')
          s=p.read_text()
          css=base64.b64decode(Path('.github/lfbets-tutorial-css.b64').read_text()).decode()
          fn=base64.b64decode(Path('.github/lfbets-tutorial-fn.b64').read_text()).decode()
          nav='.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;'
          if '.tutorial{' not in s:
              s=s.replace(nav,css+nav,1)
          old="const total=o=>o.A+o.X+o.B,odd=(o,k)=>total(o)/o[k],label=(m,k)=>k==='A'?pretty(m.option_a):k==='B'?pretty(m.option_b):'Empate';"
          new="const total=o=>o.A+o.X+o.B,odd=(o,k)=>total(o)/o[k],postOdd=(o,k,s)=>(total(o)+s)/(o[k]+s),label=(m,k)=>k==='A'?pretty(m.option_a):k==='B'?pretty(m.option_b):'Empate';"
          if 'postOdd=' not in s:
              if old not in s: raise SystemExit('odds anchor missing')
              s=s.replace(old,new,1)
          s=s.replace('stake*odd(o,pick)','stake*postOdd(o,pick,stake)',1)
          if 'function tutorial()' not in s:
              s=s.replace('function home(){',fn+'function home(){',1)
          oldhome='${rankPreview()}${roundPreview()}`}'
          newhome='${rankPreview()}${roundPreview()}${tutorial()}`}'
          if '${tutorial()}' not in s[s.index('function home(){'):s.index('function leagueIntro(){')]:
              if oldhome not in s: raise SystemExit('home anchor missing')
              s=s.replace(oldhome,newhome,1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('area-2627/index.html').read_text()
          m=re.search(r'<script>([\s\S]*)</script>',s)
          if not m: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-la-flora-tutorial.yml .github/lfbets-tutorial-css.b64 .github/lfbets-tutorial-fn.b64
          git add area-2627/index.html
          git commit -m 'Add tutorial and rules to La Flora Bets'
          git push
