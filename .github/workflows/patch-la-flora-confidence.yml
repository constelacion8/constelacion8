name: Add La Flora confidence thermometer
on:
  push:
    paths:
      - '.github/workflows/patch-la-flora-confidence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add confidence thermometer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('area-2627/index.html')
          s=p.read_text()
          old=".vs{font:400 italic 43px 'Bebas Neue';color:var(--r);text-align:center;transform:rotate(-5deg);text-shadow:0 0 18px #ff263a66}.bar{"
          new=".vs{font:400 italic 43px 'Bebas Neue';color:var(--r);text-align:center;transform:rotate(-5deg);text-shadow:0 0 18px #ff263a66}.trust{margin:0 11px 13px;padding:12px 12px 13px;border:1px solid #303b4f;border-radius:12px;background:linear-gradient(180deg,#0d1520,#070c13)}.trusttop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.trusttop b{font:700 11px 'Oswald';letter-spacing:.1em;text-transform:uppercase;color:#dce3ee}.trusttop small{font-size:10px;color:#9da8ba}.trustlabels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}.trustside:last-child{text-align:right}.trustside b{display:block;font:700 24px/1 'Oswald';color:#fff}.trustside span{display:block;margin-top:4px;font:600 11px/1.25 'Oswald';color:#c2ccda}.thermo{height:12px;display:flex;overflow:hidden;border-radius:999px;background:#1a2230;border:1px solid #3b4658;box-shadow:inset 0 1px 4px #0008}.thermo .ta{height:100%;background:linear-gradient(90deg,#8e111b,var(--r));transition:width .25s ease}.thermo .tb{height:100%;background:linear-gradient(90deg,#b9c5d6,#f4f6f9);transition:width .25s ease}.trustnone{text-align:center;font-size:11px;color:#aeb8c7;margin-bottom:8px}@media(max-width:500px){.trust{padding:13px 12px 14px}.trusttop b{font-size:12px}.trusttop small{font-size:10px}.trustside b{font-size:27px}.trustside span{font-size:12px}.thermo{height:14px}}.bar{"
          if old not in s: raise SystemExit('CSS anchor missing')
          s=s.replace(old,new,1)
          old="function count(m){return(state?.poolRows||[]).filter(r=>r.market_id===m.id).reduce((a,r)=>a+Number(r.bets_count||0),0)}async function start()"
          new="function count(m){return(state?.poolRows||[]).filter(r=>r.market_id===m.id).reduce((a,r)=>a+Number(r.bets_count||0),0)}function confidence(m){const c={A:0,X:0,B:0};for(const r of state?.poolRows||[])if(r.market_id===m.id&&c[r.pick]!==undefined)c[r.pick]+=Number(r.bets_count||0);const d=c.A+c.B,a=d?Math.round(c.A/d*100):0,b=d?100-a:0;return{...c,a,b,d}}function trust(m){const c=confidence(m),xa=c.X===1?'1 jugador ve empate':`${c.X} jugadores ven empate`;return`<div class=\"trust\"><div class=\"trusttop\"><b>Termómetro de confianza</b><small>${c.X?xa:'Apuestas A/B'}</small></div>${c.d?`<div class=\"trustlabels\"><div class=\"trustside\"><b>${c.a}%</b><span>confía en ${esc(pretty(m.option_a))}</span></div><div class=\"trustside\"><b>${c.b}%</b><span>confía en ${esc(pretty(m.option_b))}</span></div></div><div class=\"thermo\"><i class=\"ta\" style=\"width:${c.a}%\"></i><i class=\"tb\" style=\"width:${c.b}%\"></i></div>`:`<div class=\"trustnone\">Aún no hay tendencia. Sé el primero en marcar confianza.</div><div class=\"thermo\"><i class=\"ta\" style=\"width:50%\"></i><i class=\"tb\" style=\"width:50%\"></i></div>`}</div>`}async function start()"
          if old not in s: raise SystemExit('JS anchor missing')
          s=s.replace(old,new,1)
          old='</div></div><div class="bar"><div class="state ${ph}">'
          new='</div></div>${trust(m)}<div class="bar"><div class="state ${ph}">'
          if old not in s: raise SystemExit('Hero anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('area-2627/index.html').read_text()
          Path('/tmp/lfbets.js').write_text(s[s.index('<script>')+8:s.rindex('</script>')])
          PY
          node --check /tmp/lfbets.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-la-flora-confidence.yml
          git add area-2627/index.html
          git commit -m 'Add confidence thermometer to La Flora Bets'
          git push
