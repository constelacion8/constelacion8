name: Add M88 contacted municipalities tracker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-m88-contacted-ui.yml'
      - '.github/scripts/add_m88_contacted_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update M88 files
        run: python .github/scripts/add_m88_contacted_ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m88/index.html m88/app.css m88/app.js
          if ! git diff --cached --quiet; then
            git commit -m "Add contacted municipalities tracker"
            git push
          fi
