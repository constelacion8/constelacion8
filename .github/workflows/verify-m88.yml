name: Verify M88

on:
  push:
    branches: [main]
    paths:
      - 'm88/**'
      - '.github/workflows/verify-m88.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify public app
        run: |
          cat > verify-m88.cjs <<'NODE'
          const { chromium } = require('playwright');
          const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));

            let fresh=false;
            for(let attempt=0;attempt<12;attempt++){
              await page.goto(`https://constelacion8.com/m88/?fresh=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
              const title=(await page.locator('#mapSection h1').textContent().catch(()=>''))?.replace(/\s+/g,' ').trim();
              const tooltipCount=await page.locator('#mapTooltip').count();
              if(title==='Mapa comercial de DE8 Films.' && tooltipCount===0){fresh=true;break;}
              await sleep(5000);
            }
            if(!fresh) throw new Error('Fresh minimal M88 deployment not visible yet');
            if(await page.locator('#loginForm').count()) throw new Error('Unexpected login form');
            if(await page.locator('.brand-mark').count()) throw new Error('Legacy brand mark still visible in DOM');

            await page.waitForSelector('[data-island="tenerife"]',{timeout:30000});
            await page.click('[data-island="tenerife"]');
            await page.waitForSelector('.municipality-card',{timeout:30000});
            let count=await page.locator('.municipality-card').count();
            if(count!==31) throw new Error(`Tenerife expected 31, got ${count}`);

            const apiResponse = page.waitForResponse(r=>r.url().includes('/rest/v1/m88_contacts_directory') && r.request().method()==='GET',{timeout:30000});
            await page.locator('.municipality-card').filter({hasText:'Adeje'}).click();
            const response=await apiResponse;
            if(response.status()!==200) throw new Error(`Supabase directory HTTP ${response.status()}`);
            await page.waitForFunction(()=>document.querySelector('#contactCount')?.textContent!=='Cargando…',null,{timeout:30000});

            await page.waitForSelector('.contact-card .party-row',{timeout:30000});
            const partyText=(await page.locator('.contact-card .party-row').first().textContent() || '').replace(/\s+/g,' ').trim();
            if(!/PSOE|Partido Socialista/i.test(partyText)) throw new Error(`Adeje party mark missing PSOE: ${partyText}`);
            const partyOk=await page.locator('.contact-card .party-row').first().evaluate(row=>{
              const img=row.querySelector('img.party-logo');
              const badge=row.querySelector('.party-badge');
              const imageOk=!!img && img.complete && img.naturalWidth>0 && getComputedStyle(img).display!=='none';
              const badgeOk=!!badge && getComputedStyle(badge).display!=='none';
              return imageOk || badgeOk;
            });
            if(!partyOk) throw new Error('Party logo and fallback badge both unavailable');

            await page.click('#navAll');
            await page.waitForTimeout(300);
            count=await page.locator('.municipality-card').count();
            if(count!==88) throw new Error(`All municipalities expected 88, got ${count}`);
            if(errors.length) throw new Error(errors.join(' | '));

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await mobile.goto(`https://constelacion8.com/m88/?mobilecheck=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await mobile.waitForSelector('.archipelago-stage',{timeout:30000});
            const stage=await mobile.locator('.archipelago-stage').boundingBox();
            if(!stage) throw new Error('Mobile map stage missing');
            if(stage.x < -1 || stage.x + stage.width > 391) throw new Error(`Mobile map stage clipped: x=${stage.x}, width=${stage.width}`);
            for(const node of await mobile.locator('.island-node').all()){
              const box=await node.boundingBox();
              if(!box) continue;
              if(box.x < -2 || box.x + box.width > 392) throw new Error(`Mobile island clipped: x=${box.x}, width=${box.width}`);
            }
            console.log('M88_OK: minimal home + desktop + backend + party mark + mobile map fit');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node verify-m88.cjs
