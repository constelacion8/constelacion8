name: Verify M88

on:
  push:
    branches: [main]
    paths:
      - 'm88/**'
      - 'service-worker.js'
      - '.github/workflows/verify-m88.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app.js?v=20261005-outreach2' m88/index.html
          grep -q 'app.css?v=20261005-outreach2' m88/index.html
          grep -q 'id="navContacted"' m88/index.html
          grep -q 'async function showIsland' m88/app.js
          grep -q 'await loadContactedMunicipalities();' m88/app.js
          grep -q "visibilitychange" m88/app.js
          grep -q "m88_contacted_municipalities" m88/app.js
          grep -q "startsWith('/m88/')" service-worker.js
          echo 'REPOSITORY_M88_OK'

      - name: Verify deployed M88 assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://constelacion8.com/m88'
          READY=0
          for attempt in $(seq 1 18); do
            HTML=$(curl -fsSL --retry 2 --retry-delay 2 "$BASE/?verify=$GITHUB_SHA" || true)
            if grep -q 'app.js?v=20261005-outreach2' <<<"$HTML" && grep -q 'id="navContacted"' <<<"$HTML"; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = '1'

          curl -fsSL --retry 3 "$BASE/app.js?v=20261005-outreach2&sha=$GITHUB_SHA" -o /tmp/m88-app.js
          grep -q 'async function showIsland' /tmp/m88-app.js
          grep -q 'await loadContactedMunicipalities();' /tmp/m88-app.js
          grep -q 'visibilitychange' /tmp/m88-app.js
          grep -q 'm88_contacted_municipalities' /tmp/m88-app.js

          curl -fsSL --retry 3 "https://constelacion8.com/service-worker.js?sha=$GITHUB_SHA" -o /tmp/service-worker.js
          grep -q "startsWith('/m88/')" /tmp/service-worker.js
          echo 'DEPLOYED_M88_OK'
