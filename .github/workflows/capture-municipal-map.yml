name: Capture municipal map

on:
  push:
    branches: [main]
    paths:
      - 'm88/**'
      - '.github/workflows/capture-municipal-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture public municipal map
        run: |
          cat > capture-map.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000},deviceScaleFactor:1.5});
            await page.goto(`https://constelacion8.com/m88/?capture=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('.municipality-shape',{timeout:30000});
            await page.locator('.archipelago-stage').screenshot({path:'municipal-map-stage.png'});
            await page.screenshot({path:'municipal-map-page.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node capture-map.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: municipal-map-captures
          path: |
            municipal-map-stage.png
            municipal-map-page.png
          retention-days: 2
