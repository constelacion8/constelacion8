name: Verify Mapa Comercial Preview

on:
  push:
    branches: [mapa-comercial-preview]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://constelacion8.com/mapa-comercial/'
          curl -fsSL -D /tmp/headers.txt "$URL" -o /tmp/page.html
          grep -qi '^content-type:.*text/html' /tmp/headers.txt
          grep -q 'Mapa Comercial · DE8 Films' /tmp/page.html
          echo 'PUBLIC_ROUTE_OK'

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser verification
        shell: bash
        run: |
          cat > verify-mapa.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const url='https://constelacion8.com/mapa-comercial/';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(url,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('#loginForm',{timeout:30000});
            if(!(await page.locator('#authScreen').isVisible())) throw new Error('Login screen is not visible');
            const username=page.locator('#loginUsername');
            if(await username.count() !== 1) throw new Error('Username field not initialized');
            await username.fill('__invalid_verification__');
            await page.fill('#loginPassword','__invalid_verification__');
            await page.click('#loginForm button[type="submit"]');
            await page.waitForFunction(()=>document.querySelector('#loginMessage')?.textContent?.includes('incorrectos'),null,{timeout:30000});
            await page.evaluate(()=>{
              document.getElementById('authScreen').hidden=true;
              document.getElementById('app').hidden=false;
            });
            await page.click('[data-island="tenerife"]');
            await page.waitForSelector('.municipality-card',{timeout:30000});
            const title=(await page.locator('#islandTitle').textContent()||'').trim();
            const count=await page.locator('.municipality-card').count();
            if(title!=='Tenerife') throw new Error(`Wrong island title: ${title}`);
            if(count!==31) throw new Error(`Expected 31 Tenerife municipalities, got ${count}`);
            if(pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(' | ')}`);
            console.log('BROWSER_OK: login visible, backend reachable, Tenerife=31 municipalities');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node verify-mapa.cjs
