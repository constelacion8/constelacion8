name: Patch La Flora nav
on:
  push:
    paths:
      - '.github/workflows/patch-la-flora-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve navigation readability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('area-2627/index.html')
          s=p.read_text()
          old='.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#04080df0;backdrop-filter:blur(14px);border-top:1px solid #263044;padding-bottom:env(safe-area-inset-bottom)}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nb{border:0;background:none;color:#8995a8;padding:10px 2px 8px;position:relative}.nb.on{color:var(--r)}.nb.on:after{content:"";position:absolute;left:27%;right:27%;bottom:0;height:2px;background:var(--r);box-shadow:0 0 9px var(--r)}.ico{display:block;font-size:19px}.lbl{display:block;font:600 7px \'Oswald\';text-transform:uppercase;margin-top:4px}footer{text-align:center;color:#626d7e;font-size:7px;margin-top:17px}'
          new='.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#04080ef7;backdrop-filter:blur(16px);border-top:1px solid #34445d;box-shadow:0 -12px 34px rgba(0,0,0,.55),0 -1px 0 rgba(255,255,255,.05) inset;padding:2px 0 calc(env(safe-area-inset-bottom) + 4px)}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0 6px}.nb{border:0;background:none;color:#c8d2e0;padding:12px 2px 10px;position:relative;min-height:68px;text-shadow:0 1px 0 rgba(0,0,0,.35)}.nb+.nb{border-left:1px solid rgba(255,255,255,.04)}.nb.on{color:#fff}.nb.on .ico,.nb.on .lbl{color:var(--r)}.nb.on:after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:3px;border-radius:999px;background:var(--r);box-shadow:0 0 12px var(--r)}.ico{display:block;font-size:22px;line-height:1}.lbl{display:block;font:700 9px \'Oswald\';letter-spacing:.08em;text-transform:uppercase;margin-top:5px;color:inherit}footer{text-align:center;color:#758196;font-size:8px;margin-top:17px;padding-bottom:4px}'
          if old not in s:
              raise SystemExit('Navigation CSS block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-la-flora-nav.yml
          git add area-2627/index.html
          git commit -m 'Improve La Flora Bets navigation readability'
          git push
