name: Place contacted municipalities under map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/place-contacted-list-under-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch M88 contacted list
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('m88/index.html')
          s = index.read_text()

          old_header = '''      <div class="header-actions">
        <button class="header-contacted" id="navContacted" type="button">Municipios contactados <span id="contactedHeaderCount">0</span></button>
        <button class="header-count" id="navAll" type="button" aria-label="Ver los 88 municipios">88</button>
      </div>'''
          new_header = '''      <button class="header-count" id="navAll" type="button" aria-label="Ver los 88 municipios">88</button>'''
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          marker = '''      </section>

      <section class="directory" id="directorySection" hidden>'''
          home = '''        <div class="home-contacted" id="homeContacted">
          <h2>Municipios contactados.</h2>
          <div class="home-contacted-list" id="homeContactedList">
            <span class="home-contacted-empty">Aún no hay municipios contactados.</span>
          </div>
        </div>
      </section>

      <section class="directory" id="directorySection" hidden>'''
          if 'id="homeContacted"' not in s:
              if marker not in s:
                  raise SystemExit('Could not find hero/directory marker')
              s = s.replace(marker, home, 1)

          s = s.replace('app.css?v=20260909-contacted1', 'app.css?v=20260909-contacted2')
          s = s.replace('app.js?v=20260909-contacted1', 'app.js?v=20260909-contacted2')
          index.write_text(s)

          app = Path('m88/app.js')
          s = app.read_text()
          anchor = "const contactedSection = document.getElementById('contactedSection');\n"
          if "const homeContactedList" not in s:
              if anchor not in s:
                  raise SystemExit('Could not find contactedSection anchor')
              s = s.replace(anchor, anchor + "const homeContactedList = document.getElementById('homeContactedList');\n", 1)

          old = '''  const headerCount=document.getElementById('contactedHeaderCount');
  if(headerCount) headerCount.textContent=String(data.length);
  return data;'''
          new = '''  const headerCount=document.getElementById('contactedHeaderCount');
  if(headerCount) headerCount.textContent=String(data.length);
  if(homeContactedList){
    const ordered=[...data].sort((a,b)=>a.municipality_name.localeCompare(b.municipality_name,'es'));
    if(!ordered.length){
      homeContactedList.innerHTML='<span class="home-contacted-empty">Aún no hay municipios contactados.</span>';
    } else {
      homeContactedList.innerHTML=ordered.map(item=>`<button class="home-contacted-item" type="button" data-name="${escapeAttr(item.municipality_name)}" data-island-name="${escapeAttr(item.island_name)}"><strong>${escapeHtml(item.municipality_name)}</strong><span>${escapeHtml(item.island_name)}</span></button>`).join('');
      homeContactedList.querySelectorAll('.home-contacted-item').forEach(item=>item.addEventListener('click',()=>showMunicipality(item.dataset.name,item.dataset.islandName)));
    }
  }
  return data;'''
          if old not in s:
              raise SystemExit('Could not find loadContactedMunicipalities render anchor')
          s = s.replace(old, new, 1)
          app.write_text(s)

          css = Path('m88/app.css')
          s = css.read_text()
          if '.home-contacted{' not in s:
              s += '''\n.home-contacted{position:relative;z-index:4;width:min(92vw,1160px);margin:26px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.08)}.home-contacted h2{margin:0 0 14px;text-align:center;font:600 14px/1.2 "Work Sans",Arial,sans-serif;letter-spacing:-.01em;color:#fff}.home-contacted-list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.home-contacted-item{appearance:none;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#050505;padding:9px 12px;transition:.18s ease}.home-contacted-item:hover,.home-contacted-item:focus-visible{outline:none;border-color:rgba(255,205,0,.5);transform:translateY(-1px)}.home-contacted-item strong{font:600 11px "Work Sans",Arial,sans-serif;color:#fff}.home-contacted-item span{font:500 8px "Work Sans",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow)}.home-contacted-empty{display:block;width:100%;text-align:center;color:#6f6f6f;font-size:11px}body.island-open .home-contacted{display:none}@media(max-width:760px){.home-contacted{width:90vw;margin-top:16px;padding-top:20px}.home-contacted h2{font-size:13px;margin-bottom:12px}.home-contacted-list{gap:7px}.home-contacted-item{padding:8px 10px}.home-contacted-item strong{font-size:10px}.home-contacted-item span{font-size:7px}}\n'''
          css.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m88/index.html m88/app.js m88/app.css
          git commit -m "Show contacted municipalities below map"
          git push
