name: Capture projection fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-projection-fix.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture public map
        run: |
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
            await page.goto(`https://constelacion8.com/m88/?projection=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('.municipality-shape',{timeout:30000});
            await page.waitForTimeout(2500);
            await page.locator('#archipelagoStage').screenshot({path:'projection-map.png'});
            const ratios=await page.locator('.island-node.has-municipalities').evaluateAll(nodes=>nodes.map(node=>{
              const g=node.querySelector('.municipality-fill-layer');
              if(!g) return null;
              const b=g.getBBox();
              return {island:node.dataset.island,width:b.width,height:b.height,ratio:b.width/b.height};
            }).filter(Boolean));
            console.log(JSON.stringify(ratios));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: projection-fix-capture
          path: projection-map.png
          retention-days: 1
