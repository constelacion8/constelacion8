name: Add La Flora article comments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-la-flora-comments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add article comments UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('area-2627/index.html')
          s=p.read_text(encoding='utf-8')

          css=""".comments{margin-top:16px;border-top:1px solid #293346;padding-top:18px}.commentshead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:11px}.commentshead h3{margin:0;font:700 20px 'Oswald';text-transform:uppercase}.commentshead small{color:#98a5b8;font-size:10px}.commentform{display:grid;gap:8px;margin-bottom:14px}.commentform textarea{width:100%;min-height:88px;resize:vertical;border:1px solid #3a465a;border-radius:11px;background:#070c13;color:#fff;padding:12px;font:500 13px/1.5 'Work Sans';outline:0}.commentform textarea:focus{border-color:var(--r)}.commentform .primary{width:auto;justify-self:end;padding:10px 16px}.commentlist{display:grid;gap:8px}.comment{border:1px solid #2d3749;border-radius:11px;background:#090f18;padding:11px 12px}.commenttop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}.commenttop b{font:700 13px 'Oswald';color:#fff}.commentactions{display:flex;gap:7px}.commentactions button{border:0;background:none;color:#9eabbd;padding:0;font:700 9px 'Oswald';text-transform:uppercase;letter-spacing:.06em}.commentactions button:hover{color:#fff}.comment p{margin:0;color:#d7dee8;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.commentempty{padding:12px;border:1px dashed #364258;border-radius:10px;color:#98a5b8;font-size:11px;text-align:center}@media(max-width:500px){.commentshead h3{font-size:21px}.comment p{font-size:13.5px}.commentform textarea{font-size:14px}}"""
          assert '</style>' in s
          s=s.replace('</style>',css+'</style>',1)

          old="pressFilter='all';"
          assert old in s
          s=s.replace(old,"pressFilter='all',comments=null,commentBusy=false;",1)

          pat=r"function articleView\(p\)\{.*?\}function press\(\)"
          m=re.search(pat,s,re.S)
          assert m, 'articleView block not found'
          repl=r'''function commentCard(c){return`<div class="comment"><div class="commenttop"><b>${esc(pretty(c.display_name))}</b><span class="commentactions">${c.can_edit?`<button data-comment-edit="${esc(c.id)}">Editar</button>`:''}${c.can_delete?`<button data-comment-delete="${esc(c.id)}">Borrar</button>`:''}</span></div><p>${esc(c.body)}</p></div>`}function commentsView(p){const list=comments===null?`<div class="commentempty">Cargando comentarios…</div>`:comments.length?comments.map(commentCard).join(''):`<div class="commentempty">Todavía no hay comentarios. Sé el primero.</div>`;return`<section class="comments"><div class="commentshead"><h3>Comentarios</h3><small>${comments===null?'':comments.length+' '+(comments.length===1?'comentario':'comentarios')}</small></div><form class="commentform" id="commentForm"><textarea id="commentBody" maxlength="1200" placeholder="Escribe tu comentario…" required></textarea><button class="primary" ${commentBusy?'disabled':''}>${commentBusy?'PUBLICANDO…':'PUBLICAR'}</button></form><div class="commentlist">${list}</div></section>`}function articleView(p){const paras=String(p.body||'').split(/\n\s*\n/).filter(Boolean);return`<article class="article"><div class="articletop"><button class="backpress" data-back-press>‹ Volver a Crónicas</button></div><div class="articlebody"><div class="postmeta"><span class="posttag"><i></i>${esc(postTag(p))}</span></div><h1>${esc(p.title)}</h1><p class="articlelead">${esc(p.excerpt)}</p><div class="articletext">${paras.map(x=>`<p>${esc(x)}</p>`).join('')}</div>${commentsView(p)}</div></article>`}async function loadComments(slug){comments=null;try{comments=await rpc('lf_get_post_comments',{p_session_token:session,p_post_slug:slug})}catch(e){comments=[];msg=e.message}}async function addComment(slug,body){commentBusy=true;main();try{await rpc('lf_add_post_comment',{p_session_token:session,p_post_slug:slug,p_body:body});await loadComments(slug)}catch(e){msg=e.message}finally{commentBusy=false;main()}}async function editComment(id){const c=(comments||[]).find(x=>x.id===id);if(!c)return;const body=prompt('Editar comentario',c.body);if(body===null)return;const text=body.trim();if(!text)return;try{await rpc('lf_update_post_comment',{p_session_token:session,p_comment_id:id,p_body:text});await loadComments(articleSlug);main()}catch(e){msg=e.message;main()}}async function deleteComment(id){if(!confirm('¿Borrar este comentario?'))return;try{await rpc('lf_delete_post_comment',{p_session_token:session,p_comment_id:id});await loadComments(articleSlug);main()}catch(e){msg=e.message;main()}}function press()'''
          s=s[:m.start()]+repl+s[m.end():]

          old="document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;articleSlug='';history.replaceState(null,'',location.pathname+location.search);msg='';main()});document.querySelectorAll('[data-post]').forEach(x=>x.onclick=()=>{articleSlug=x.dataset.post;history.replaceState(null,'',location.pathname+location.search+'#articulo='+encodeURIComponent(articleSlug));main();window.scrollTo({top:0,behavior:'smooth'})});"
          new="document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;articleSlug='';comments=null;history.replaceState(null,'',location.pathname+location.search);msg='';main()});document.querySelectorAll('[data-post]').forEach(x=>x.onclick=async()=>{articleSlug=x.dataset.post;comments=null;history.replaceState(null,'',location.pathname+location.search+'#articulo='+encodeURIComponent(articleSlug));main();window.scrollTo({top:0,behavior:'smooth'});await loadComments(articleSlug);main()});"
          assert old in s, 'post binding not found'
          s=s.replace(old,new,1)

          old="document.querySelector('[data-back-press]')?.addEventListener('click',()=>{articleSlug='';history.replaceState(null,'',location.pathname+location.search);main()});"
          new="document.querySelector('[data-back-press]')?.addEventListener('click',()=>{articleSlug='';comments=null;history.replaceState(null,'',location.pathname+location.search);main()});document.getElementById('commentForm')?.addEventListener('submit',async e=>{e.preventDefault();const body=document.getElementById('commentBody')?.value?.trim();if(body&&!commentBusy)await addComment(articleSlug,body)});document.querySelectorAll('[data-comment-edit]').forEach(x=>x.onclick=()=>editComment(x.dataset.commentEdit));document.querySelectorAll('[data-comment-delete]').forEach(x=>x.onclick=()=>deleteComment(x.dataset.commentDelete));"
          assert old in s, 'back binding not found'
          s=s.replace(old,new,1)

          old="state=await loadState()}catch{session='';state=null;localStorage.removeItem(K2)}render()"
          new="state=await loadState();if(articleSlug)await loadComments(articleSlug)}catch{session='';state=null;localStorage.removeItem(K2)}render()"
          assert old in s, 'start load marker not found'
          s=s.replace(old,new,1)

          old="state=await loadState();tab=articleSlug?'press':'home';render()"
          new="state=await loadState();tab=articleSlug?'press':'home';if(articleSlug)await loadComments(articleSlug);render()"
          assert old in s, 'login load marker not found'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('area-2627/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8
          b=s.rindex('</script>')
          Path('/tmp/la-flora.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/la-flora.js
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add area-2627/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add comments to La Flora articles"
            git push origin main
          fi
