<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Constelación 8 · Acceso</title>
<style>
:root{--bg:#0e1018;--card:#191c28;--line:#303546;--txt:#f7f8fb;--mut:#969cac;--acc:#ff625d;--green:#47d692;--yellow:#ffd44d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#282d40 0,#0e1018 42%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}.hide{display:none!important}.screen{min-height:100vh;display:grid;place-items:center;padding:24px 18px}.box{width:100%;max-width:430px}.neutral-brand{text-align:center;font-weight:900;letter-spacing:.08em;margin-bottom:34px}.neutral-brand span{font-size:15px}.neutral-brand b{font-size:31px;margin-left:6px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--mut);text-transform:uppercase}h1{font-size:32px;line-height:1.02;letter-spacing:-.045em;margin:7px 0 9px}p{color:#c8ccd7;line-height:1.45}.login-copy{text-align:center;margin-bottom:23px}.card{background:linear-gradient(180deg,#1d202e,#171a25);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 22px 55px rgba(0,0,0,.25)}label{display:block;color:var(--mut);font-size:11px;font-weight:800;margin:7px 0 13px}input,select{width:100%;display:block;margin-top:6px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#11131c;color:white;outline:none}input:focus,select:focus{border-color:var(--acc)}button{border:0;border-radius:11px;font-weight:950;cursor:pointer}.primary{width:100%;padding:14px;background:var(--acc);color:white;margin-top:7px}.neutral .primary{background:#f2f3f7;color:#161821}.primary:disabled{opacity:.45}.err{font-size:11px;color:#ffaaa6;margin-top:10px}.app{max-width:560px;margin:auto;padding:19px 16px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:1000;letter-spacing:-.055em;font-size:26px}.brand b{color:var(--acc)}.brand small{font-size:11px;color:var(--mut);letter-spacing:.02em;margin-left:4px}.logout{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:#181b27;color:#aeb3c1}.wallet{display:flex;justify-content:space-between;align-items:flex-end;padding:21px 2px 10px}.wallet small{display:block;color:var(--mut);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.wallet strong{font-size:31px;letter-spacing:-.05em}.pos{text-align:right}.pos strong{font-size:25px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 14px}.tab{padding:11px 4px;border:1px solid var(--line);background:#171a25;color:var(--mut)}.tab.on{background:var(--acc);border-color:var(--acc);color:white}.panel{background:linear-gradient(180deg,#1d202e,#171a25);border:1px solid var(--line);border-radius:21px;overflow:hidden;margin-top:13px}.pad{padding:17px}.duelhead{display:flex;justify-content:space-between;gap:8px;padding:17px 17px 8px}.state{font-size:11px;font-weight:950;margin-top:5px;color:var(--green)}.close{text-align:right;color:var(--mut);font-size:10px}.close b{display:block;color:#d4d7e0;margin-top:3px}.match{display:grid;grid-template-columns:1fr 42px 1fr;gap:6px;align-items:center;padding:17px;background:linear-gradient(100deg,rgba(255,98,93,.08),transparent 45%,rgba(255,212,77,.05))}.fighter h2{font-size:23px;line-height:1;margin:6px 0 0;letter-spacing:-.04em;overflow-wrap:anywhere}.fighter.r{text-align:right}.pts{display:inline-block;font-size:10px;color:#ccd0da;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.vs{text-align:center;color:var(--acc);font-weight:1000}.question{font-size:13px;padding:0 17px 8px}.opts{padding:0 13px}.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:9px;padding:12px;margin:8px 0;border:1px solid var(--line);background:#11141d;color:white;text-align:left}.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.opt:disabled{opacity:.8}.optkey{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#252938;margin-right:9px;font-size:12px}.opt small{display:block;color:var(--mut);font-size:9px;margin-top:3px}.odd{text-align:right;min-width:58px}.odd strong{font-size:18px}.stakebox{margin:13px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#202331}.stakes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stake{padding:10px 2px;border:1px solid var(--line);background:#151822;color:white}.stake.on{background:var(--acc);border-color:var(--acc)}.stake:disabled{opacity:.25}.estimate{display:flex;justify-content:space-between;margin:10px 2px;color:var(--mut);font-size:10px}.estimate b{color:var(--yellow)}.rule{display:block;color:var(--mut);font-size:9px;line-height:1.4;margin-top:9px}.pool{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:13px 17px;background:#141722;color:var(--mut);font-size:10px}.pool b{color:white}.receipt,.notice{margin:13px;padding:12px;border-radius:13px;background:#232735;font-size:11px}.receipt{border:1px solid rgba(71,214,146,.3);color:#8ce9ba}.rows{border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:9px;padding:12px 3px;border-bottom:1px solid var(--line)}.row .num{width:26px;color:var(--mut);font-size:11px}.row .name{flex:1}.row .name b{display:block;font-size:13px}.row .name small{display:block;color:var(--mut);font-size:9px;margin-top:2px}.row>strong{font-size:13px}.me{background:rgba(255,98,93,.06)}.toast{margin-bottom:12px;padding:10px 12px;background:#292d3c;border:1px solid #424759;border-radius:11px;font-size:11px}.admin{border-color:#4a5065}.admin h2{font-size:20px;margin:5px 0 12px}.admin3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.admin3 button{padding:10px 5px;background:#252938;color:white;border:1px solid var(--line);font-size:10px}.create{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}.create h3{margin:0 0 9px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{width:100%;padding:13px;background:#f1f2f6;color:#171821;margin-top:10px}.history .row{justify-content:space-between}.status{font-size:9px;font-weight:900}.won{color:#81e8b6}.lost{color:#ff9d98}.pending{color:#ffe07a}footer{text-align:center;color:#626879;font-size:9px;margin-top:18px}.loading{text-align:center;color:var(--mut);padding:50px 15px}@media(max-width:380px){.stakes{grid-template-columns:1fr 1fr}.admin3{grid-template-columns:1fr}.fighter h2{font-size:20px}}
</style>
</head>
<body>
<div id="root"><div class="screen"><div class="loading">Cargando acceso…</div></div></div>
<script>
(()=>{'use strict';
const API='https://kvoldyeinvjajsimxmyc.supabase.co/functions/v1/c8-portal-2627-api',root=document.getElementById('root');
const K1='c8_access_2627',K2='c8_user_2627';let gate=localStorage.getItem(K1)||'',session=localStorage.getItem(K2)||'',state=null,tab='duel',pick='',stake=100,msg='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-ES').format(Number(n||0))+' ƒ';
async function rpc(name,args){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:name,args})});let data;try{data=await r.json()}catch{data=null}if(!r.ok){const m=data?.message||data?.error||'No se pudo completar la operación.';throw Error(m)}return data}
function me(){return state?.profiles?.find(x=>x.id===state.currentId)||null}function admin(){return me()?.role==='admin'}
function market(){return state?.markets?.find(x=>x.status==='open')||state?.markets?.[0]||null}function mybet(m){return state?.bets?.find(x=>x.market_id===m?.id&&x.user_id===state.currentId)||null}
function pools(m){const seed=Number(m?.seed_per_option||100),o={A:seed,X:seed,B:seed};for(const r of state?.poolRows||[])if(r.market_id===m.id)o[r.pick]+=Number(r.amount||0);return o}function total(o){return o.A+o.X+o.B}function odd(o,k){return total(o)/o[k]}function label(m,k){return k==='A'?m.option_a:k==='B'?m.option_b:'Empate'}
async function start(){try{if(gate&&await rpc('lf_gate_verify',{p_token:gate})!==true){gate='';session='';localStorage.removeItem(K1);localStorage.removeItem(K2)}}catch{gate='';session=''}if(gate&&session){try{state=await rpc('lf_get_state',{p_session_token:session})}catch{session='';state=null;localStorage.removeItem(K2)}}render()}
function gateView(){document.title='Constelación 8 · Acceso';root.innerHTML=`<section class="screen neutral"><div class="box"><div class="neutral-brand"><span>CONSTELACIÓN</span><b>8</b></div><div class="login-copy"><div class="eyebrow">ÁREA PRIVADA</div><h1>Acceso restringido</h1><p>Introduce tus credenciales para continuar.</p></div><form class="card" id="gform"><label>Usuario<input id="gu" autocomplete="username" autocapitalize="none" required></label><label>Contraseña<input id="gp" type="password" autocomplete="current-password" required></label><button class="primary">ACCEDER</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></div></section>`;document.getElementById('gform').onsubmit=async e=>{e.preventDefault();msg='';try{gate=await rpc('lf_gate_login',{p_username:gu.value,p_password:gp.value});if(!gate)throw Error('Credenciales incorrectas.');localStorage.setItem(K1,gate);render()}catch(x){msg=x.message||'No se pudo acceder.';render()}}}
function loginView(){document.title='Constelación 8 · Acceso';root.innerHTML=`<section class="screen"><div class="box"><div class="brand" style="text-align:center;font-size:32px">LA <b>FLORA</b><small>26/27</small></div><div class="login-copy"><div class="eyebrow">EL MERCADO DE LA JORNADA</div><h1>¿A quién le pones tus florines?</h1><p>Un duelo. Tres resultados. Toda La Flora mirando.</p></div><form class="card" id="uform"><label>Usuario<input id="uu" autocomplete="username" autocapitalize="none" required></label><label>Contraseña<input id="up" type="password" autocomplete="current-password" required></label><button class="primary">ENTRAR</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></div></section>`;document.getElementById('uform').onsubmit=async e=>{e.preventDefault();msg='';try{session=await rpc('lf_player_login',{p_gate_token:gate,p_username:uu.value,p_password:up.value});if(!session)throw Error('Usuario o contraseña incorrectos.');localStorage.setItem(K2,session);state=await rpc('lf_get_state',{p_session_token:session});render()}catch(x){msg=x.message||'No se pudo entrar.';render()}}}
function pos(){const m=me();return 1+(state.profiles||[]).filter(p=>Number(p.balance)>Number(m.balance)).length}
function main(){const m=me();document.title='La Flora · 26/27';root.innerHTML=`<main class="app"><header class="top"><div class="brand">LA <b>FLORA</b><small>26/27</small></div><button id="logout" class="logout">↗</button></header><section class="wallet"><div><small>Tu saldo</small><strong>${money(m.balance)}</strong></div><div class="pos"><small>Ranking</small><strong>#${pos()}</strong></div></section><nav class="tabs"><button class="tab ${tab==='duel'?'on':''}" data-tab="duel">Duelo</button><button class="tab ${tab==='rank'?'on':''}" data-tab="rank">Ranking</button><button class="tab ${tab==='hist'?'on':''}" data-tab="hist">Mis apuestas</button></nav>${msg?`<div class="toast">${esc(msg)}</div>`:''}${tab==='duel'?duel():tab==='rank'?ranking():history()}<footer>Juego privado · Florines sin valor económico</footer></main>`;bindMain()}
function duel(){const m=market();if(!m)return `<section class="panel"><div class="pad"><h2>No hay duelo publicado</h2><p>Cuando se publique la jornada aparecerá aquí.</p>${admin()?createForm():''}</div></section>`;const o=pools(m),b=mybet(m),open=m.status==='open'&&(!m.closes_at||new Date()<new Date(m.closes_at));return `<section class="panel"><div class="duelhead"><div><div class="eyebrow">GRAN DUELO · JORNADA ${m.jornada}</div><div class="state">${open?'● APUESTAS ABIERTAS':'MERCADO CERRADO'}</div></div><div class="close">CIERRE<b>${m.closes_at?new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(m.closes_at)):'Manual'}</b></div></div><div class="match"><div class="fighter"><span class="pts">${m.option_a_points||0} pts</span><h2>${esc(m.option_a)}</h2></div><div class="vs">VS</div><div class="fighter r"><span class="pts">${m.option_b_points||0} pts</span><h2>${esc(m.option_b)}</h2></div></div><p class="question">¿Quién terminará por delante cuando cierre la jornada?</p><div class="opts">${['A','X','B'].map(k=>`<button class="opt ${pick===k?'sel':''}" data-pick="${k}" ${(!open||b)?'disabled':''}><span><span class="optkey">${k}</span><b>${esc(label(m,k))}</b><small>${Math.round(o[k]/total(o)*100)}% del bote · ${money(o[k])}</small></span><span class="odd"><small>Ahora</small><strong>x${odd(o,k).toFixed(2)}</strong></span></button>`).join('')}</div>${b?`<div class="receipt">Tu apuesta: <b>${money(b.amount)} · ${esc(label(m,b.pick))}</b>${m.status==='closed'?` · ${b.status==='won'?`GANADA +${money(b.payout)}`:'PERDIDA'}`:` · x${odd(o,b.pick).toFixed(2)} estimada`}</div>`:open?stakeBox(o):`<div class="notice">Las apuestas están cerradas.${m.result?` Resultado: <b>${esc(label(m,m.result))}</b>`:''}</div>`}<div class="pool"><span>Bote virtual · ${(state?.poolRows||[]).filter(r=>r.market_id===m.id).reduce((a,r)=>a+Number(r.bets_count||0),0)}/${state.profiles.length} han apostado</span><b>${money(total(o))}</b></div></section>${admin()?adminPanel(m):''}`}
function stakeBox(o){const m=me(),vals=[25,50,100,250];if(!vals.some(v=>v<=m.balance))return `<div class="notice">No tienes florines para la apuesta mínima. Recibirás la paga semanal al resolver la jornada.</div>`;if(stake>m.balance)stake=vals.filter(v=>v<=m.balance).pop();return `<div class="stakebox"><div class="stakes">${vals.map(v=>`<button class="stake ${stake===v?'on':''}" data-stake="${v}" ${v>m.balance?'disabled':''}>${money(v)}</button>`).join('')}</div>${pick?`<div class="estimate"><span>Retorno estimado</span><b>${money(Math.round(stake*odd(o,pick)))}</b></div>`:''}<button id="bet" class="primary" ${pick?'':'disabled'}>${pick?`APOSTAR ${money(stake)}`:'ELIGE A, X O B'}</button><small class="rule">Solo una apuesta por jornada. La cuota definitiva se fija al cerrar el mercado.</small></div>`}
function ranking(){const rows=[...state.profiles].sort((a,b)=>b.balance-a.balance||a.display_name.localeCompare(b.display_name));return `<section class="panel"><div class="pad"><div class="eyebrow">CLASIFICACIÓN</div><h2>Los más ricos de La Flora</h2><div class="rows">${rows.map((p,i)=>`<div class="row ${p.id===state.currentId?'me':''}"><span class="num">${i+1}</span><span class="name"><b>${esc(p.display_name)}</b><small>${esc(p.team_name||'')}</small></span><strong>${money(p.balance)}</strong></div>`).join('')}</div></div></section>`}
function history(){const mine=(state.bets||[]).filter(b=>b.user_id===state.currentId),mk=id=>state.markets.find(m=>m.id===id);return `<section class="panel history"><div class="pad"><div class="eyebrow">HISTORIAL</div><h2>Mis apuestas</h2>${mine.length?mine.map(b=>{const m=mk(b.market_id);return `<div class="row"><span><b>J${m?.jornada||'—'} · ${esc(m?label(m,b.pick):b.pick)}</b><small>${money(b.amount)}</small></span><span class="status ${b.status}">${b.status==='won'?`GANADA · +${money(b.payout)}`:b.status==='lost'?'PERDIDA':'PENDIENTE'}</span></div>`}).join(''):'<p>Todavía no has apostado.</p>'}</div></section>`}
function adminPanel(m){return `<section class="panel admin"><div class="pad"><div class="eyebrow">ADMIN</div><h2>${m.status==='open'?'Resolver jornada':'Jornada resuelta'}</h2>${m.status==='open'?`<div class="admin3"><button data-res="A">Gana ${esc(m.option_a)}</button><button data-res="X">Empate</button><button data-res="B">Gana ${esc(m.option_b)}</button></div>`:createForm()}</div></section>`}
function createForm(){const next=Math.max(0,...state.markets.map(m=>Number(m.jornada)||0))+1,ps=[...state.profiles].sort((a,b)=>a.display_name.localeCompare(b.display_name)),opts=ps.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join('');return `<form id="create" class="create"><h3>Publicar siguiente duelo</h3><div class="two"><label>Jornada<input name="jornada" type="number" min="1" value="${next}" required></label><label>Cierre<input name="closes_at" type="datetime-local"></label></div><div class="two"><label>Opción A<select name="a" required>${opts}</select></label><label>Puntos<input name="ap" type="number" min="0" value="0"></label></div><div class="two"><label>Opción B<select name="b" required>${opts}</select></label><label>Puntos<input name="bp" type="number" min="0" value="0"></label></div><button class="secondary">PUBLICAR DUELO</button></form>`}
function bindMain(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;msg='';main()});document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{pick=x.dataset.pick;main()});document.querySelectorAll('[data-stake]').forEach(x=>x.onclick=()=>{stake=Number(x.dataset.stake);main()});document.getElementById('logout').onclick=async()=>{try{await rpc('lf_player_logout',{p_session_token:session})}catch{}session='';state=null;localStorage.removeItem(K2);render()};document.getElementById('bet')?.addEventListener('click',async()=>{const m=market();if(!confirm(`¿Confirmas ${money(stake)} a ${label(m,pick)}?`))return;try{await rpc('lf_place_bet',{p_session_token:session,p_market_id:m.id,p_pick:pick,p_amount:stake});msg='Apuesta confirmada.';pick='';state=await rpc('lf_get_state',{p_session_token:session})}catch(e){msg=e.message}main()});document.querySelectorAll('[data-res]').forEach(x=>x.onclick=async()=>{const m=market(),r=x.dataset.res;if(!confirm(`¿Cerrar con “${label(m,r)}”?`))return;try{await rpc('lf_resolve_market',{p_session_token:session,p_market_id:m.id,p_result:r});msg='Jornada resuelta.';state=await rpc('lf_get_state',{p_session_token:session})}catch(e){msg=e.message}main()});document.getElementById('create')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await rpc('lf_create_market',{p_session_token:session,p_jornada:Number(f.get('jornada')),p_option_a_player_id:f.get('a'),p_option_a_points:Number(f.get('ap')||0),p_option_b_player_id:f.get('b'),p_option_b_points:Number(f.get('bp')||0),p_closes_at:f.get('closes_at')?new Date(f.get('closes_at')).toISOString():null});msg='Duelo publicado.';state=await rpc('lf_get_state',{p_session_token:session})}catch(x){msg=x.message}main()})}
function render(){if(!gate)return gateView();if(!session||!state)return loginView();main()}start();
})()
</script>
</body>
</html>
