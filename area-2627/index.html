(()=>{'use strict';const API='https://kvoldyeinvjajsimxmyc.supabase.co/functions/v1/c8-portal-2627-api',root=document.getElementById('root'),K1='c8_access_2627',K2='c8_user_2627';let gate=localStorage.getItem(K1)||'',session=localStorage.getItem(K2)||'',state=null,tab='home',pick='',stake=100,msg='',lastPhase='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-ES').format(Number(n||0))+' ƒ',pretty=n=>String(n||'').replace(/andrew perilla/i,'Andrew Perilla');async function rpc(action,args){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,args})});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.message||d?.error||'No se pudo completar la operación.');return d}const me=()=>state?.profiles?.find(x=>x.id===state.currentId),market=()=>state?.markets?.find(x=>x.status==='open')||state?.markets?.[0]||null,mybet=m=>state?.bets?.find(x=>x.market_id===m?.id&&x.user_id===state.currentId)||null,rank=()=>[...(state?.profiles||[])].sort((a,b)=>b.balance-a.balance||a.display_name.localeCompare(b.display_name));function pools(m){const s=Number(m?.seed_per_option||100),o={A:s,X:s,B:s};for(const r of state?.poolRows||[])if(r.market_id===m.id)o[r.pick]+=Number(r.amount||0);return o}const total=o=>o.A+o.X+o.B,odd=(o,k)=>total(o)/o[k],postOdd=(o,k,s)=>(total(o)+s)/(o[k]+s),label=(m,k)=>k==='A'?pretty(m.option_a):k==='B'?pretty(m.option_b):'Empate';function phase(m){if(!m||m.status==='closed')return'closed';if(!m.closes_at)return'soon';const c=new Date(m.closes_at).getTime(),n=Date.now();return n<c-864e5?'soon':n>=c?'closed':'open'}function target(m){if(!m?.closes_at)return 0;const c=new Date(m.closes_at).getTime();return phase(m)==='soon'?c-864e5:phase(m)==='open'?c:0}function cd(ms){if(ms<=0)return'00h 00m 00s';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return`${String(h).pad id="gu" required autocapitalize="none"></label><label>Contraseña<input id="gp" type="password" required></label><button class="primary">ACCEDER</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></div></section>`;gf.onsubmit=async e=>{e.preventDefault();msg='';try{gate=await rpc('lf_gate_login',{p_username:gu.value,p_password:gp.value});if(!gate)throw Error('Credenciales incorrectas.');localStorage.setItem(K1,gate);render()}catch(x){msg=x.message;render()}}}function loginView(){document.title='La Flora Bets · Acceso';root.innerHTML=`<section class="screen"><div class="box"><div class="lf"><small>LaLiga Fantasy · La Flora 26.27</small><strong>LA FLORA <i>BETS</i></strong></div><div class="copy"><div class="eye">ACCESO DE JUGADOR</div><p>Tu saldo, tus apuestas y el duelo de la jornada.</p></div><form class="card" id="uf"><label>Usuario<input id="uu" required autocapitalize="none"></label><label>Contraseña<input id="up" type="password" required></label><button class="primary">ENTRAR</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</form></div></section>`;uf.onsubmit=async e=>{e.preventDefault();msg='';try{session=await rpc('lf_player_login',{p_gate_token:gate,p_username:uu.value,p_password:up.value});if(!session)throw Error('Usuario o contraseña incorrectos.');localStorage.setItem(K2,session);state=await rpc('lf_get_state',{p_session_token:session});tab='home';render()}catch(x){msg=x.message;render()}}}function nav(){return`<nav class="nav"><div class="navin">${[['home','⌂','Inicio'],['rank','♛','Ranking'],['rounds','◷','Jornadas'],['hist','▤','Mis apuestas']].map(x=>`<button class="nb ${tab===x[0]?'on':''}" data-tab="${x[0]}"><span class="ico">${x[1]}</span><span class="lbl">${x[2]}</span></button>`).join('')}</div></nav>`}function main(){const u=me();document.title='La Flora Bets · 26.27';root.innerHTML=`<main class="app"><header class="top"><div class="logo"><small>LALIGA FANTASY · LA FLORA 26.27</small><strong>LA FLORA <b>BETS</b></strong></div><div style="display:flex;gap:8px;align-items:center"><div class="who"><span>Jugador</span>${esc(pretty(u.display_name))}</div><button id="out" class="out">↗</button></div></header>${msg?`<div class="notice">${esc(msg)}</div>`:''}${tab==='home'?home():tab==='rank'?ranking():tab==='rounds'?rounds():history()}<footer>Florines sin valor económico · Juego privado entre amigos</footer></main>${nav()}`;bind();lastPhase=market()?phase(market()):'';tick()}function tutorial(){return`<details class="tutorial"><summary><div class="tuticon">📘</div><div class="tuttitle"><small>¿Primera vez?</small><strong>Tutorial y normas</strong><span>Florines, bote y cuotas<br>Ejemplo real: Jornada 5</span></div><b class="tutopen">ABRIR TUTORIAL +</b></summary><div class="tutorialbody"><div class="tutlead">La Flora Bets es un juego privado entre los 10 participantes de La Flora. No hay dinero real: todo funciona con <b>florines (ƒ)</b> y un bote común que cambia según las apuestas del grupo.</div><div class="tutgrid"><div class="tutitem"><b>1 · Tus florines</b><p>Cada jugador empieza con <em>1.000 ƒ</em>. Los florines no se compran, no se venden y no tienen valor económico. Al resolverse cada jornada, todos reciben además <em>+100 ƒ</em> para mantener viva la competición.</p></div><div class="tutitem"><b>2 · A, X o B</b><p>A significa que el primer jugador termina la jornada por delante en la <b>clasificación general</b>; B, que lo hace el segundo. X significa que ambos terminan con los mismos puntos totales. No apostamos simplemente a quién suma más puntos esa semana.</p></div><div class="tutitem"><b>3 · Qué es el bote</b><p>Al abrir el mercado hay un fondo virtual de <em>100 ƒ en A, 100 ƒ en X y 100 ƒ en B</em>: por eso el bote arranca en 300 ƒ. Después se añaden los florines apostados por todos. Al final, el bote se reparte proporcionalmente entre quienes hayan acertado.</p></div><div class="tutitem"><b>4 · Qué significa x3,00</b><p>Es el multiplicador estimado en ese momento. Si la cuota final fuese x3,00 y hubieras apostado 100 ƒ, recibirías <em>300 ƒ en total</em>: tus 100 ƒ más 200 ƒ de ganancia. Las cuotas cambian mientras entra dinero y quedan fijadas al cerrarse el mercado.</p></div><div class="tutitem"><b>5 · ¿Influye apostar 25 o 250?</b><p>Sí. Cuanto más apuestas, mayor puede ser tu premio, pero también arriesgas más. Además, tu propia apuesta entra en el bote: si metes mucho a un lado, la cuota de ese resultado baja y las alternativas suben. El retorno estimado de la pantalla ya calcula este efecto.</p></div><div class="tutitem"><b>6 · Termómetro de confianza</b><p>Aquí no importa cuánto dinero pone cada uno, sino <b>cuántas personas</b> eligen a cada jugador. Una apuesta de 25 ƒ cuenta exactamente igual que una de 250 ƒ para medir la confianza del grupo. Las X se muestran aparte.</p></div><div class="tutitem"><b>7 · Apertura y cierre</b><p>Las apuestas se abren <em>24 horas antes</em> del primer partido de la jornada y se bloquean exactamente cuando empieza ese partido. Cada jugador puede realizar <b>una sola apuesta por jornada</b>.</p></div></div><div class="tutexample"><span class="tag">Ejemplo · Jornada 5</span><h4>Tosco13 (177) vs Andrew Perilla (175)</h4><p>El duelo real parte con solo 2 puntos de diferencia. La pregunta es quién estará por delante en la clasificación general cuando termine la Jornada 5; si terminan empatados a puntos, gana la X.</p><p>Al abrir el mercado tenemos 100 ƒ en cada opción:</p><div class="tutmath"><div><small>Tosco13</small><b>100 ƒ · x3,00</b></div><div><small>Empate</small><b>100 ƒ · x3,00</b></div><div><small>Andrew</small><b>100 ƒ · x3,00</b></div></div><p>El bote inicial es 300 ƒ. Si eres el primero en apostar y metes <b>100 ƒ a Tosco13</b>, el bote pasa a 400 ƒ y el lado de Tosco pasa a 200 ƒ. Su cuota estimada después de tu propia apuesta sería aproximadamente <b>x2,00</b>. Si nadie más apostara, acertar te devolvería 200 ƒ: 100 ƒ tuyos + 100 ƒ de ganancia.</p><p>Ahora imagina que al cierre el bote queda así: Tosco13 500 ƒ, X 100 ƒ y Andrew 200 ƒ. El bote total sería 800 ƒ. Las cuotas finales serían aproximadamente <b>Tosco x1,60 · X x8,00 · Andrew x4,00</b>. Por eso acertar una opción en la que confía poca gente puede pagar mucho más.</p></div><div class="tutnote"><b>Regla de oro:</b> la cuota que ves antes del cierre es orientativa. El multiplicador definitivo depende de cómo quede repartido el bote cuando empiece el primer partido.</div></div></details>`}function home(){const m=market();return`${leagueIntro()}${m?hero(m):'<div class="panel"><div class="ph"><h2>No hay duelo publicado</h2></div></div>'}${rankPreview()}${roundPreview()}${tutorial()}`}function leagueIntro(){return`<section class="leagueintro"><div class="kicker">JORNADA 5 · LA LIGA, AL ROJO VIVO</div><p>La Jornada 5 llega con varios cruces directos. <b>JM. (201)</b> y <b>Berto115 (195)</b> están separados por 6 puntos; <b>.Rives. (123)</b> y <b>Fran.88 (119)</b>, por solo 4; y <b>Vidrio77 (85)</b> y <b>thoth (69)</b> completan otra pelea abierta. Pero todas las miradas están en el 4.º puesto: <b>Tosco13 (177)</b> y <b>Andrew Perilla (175)</b>, separados por solo 2 puntos. El gran duelo de la jornada está servido.</p></section>`}function hero(m){const o=pools(m),b=mybet(m),ph=phase(m),t=target(m),active=ph==='open';return`<section class="hero"><div class="herohead"><div class="eye">LA FLORA 26.27</div><div class="round">JORNADA <b>${m.jornada}</b></div><div class="brush">Gran duelo de la jornada</div></div><div class="duel"><div class="c"><div class="av"></div><h2>${esc(pretty(m.option_a))}</h2><div class="pts"><b>${m.option_a_points||0}</b><small>PFSY</small></div></div><div class="vs">VS</div><div class="c"><div class="av"></div><h2>${esc(pretty(m.option_b))}</h2><div class="pts"><b>${m.option_b_points||0}</b><small>PFSY</small></div></div></div>${trust(m)}<div class="bar"><div class="state ${ph}"><span class="dot"></span>${ph==='open'?'APUESTAS ABIERTAS':ph==='soon'?'PRÓXIMAMENTE':'APUESTAS CERRADAS'}</div><div class="cd">${ph==='closed'?`<small>Inicio jornada</small><b>${fd(m.closes_at)}</b>`:`<small>${ph==='soon'?'Abre en':'Cierra en'}</small><b class="js-cd" data-t="${t}">${cd(t-Date.now())}</b>`}</div></div><div class="rule">Abren 24 horas antes del primer partido y se bloquean exactamente cuando comienza.</div><div class="q">¿Quién terminará por delante en la clasificación al cierre de la jornada?</div><div class="choices">${['A','X','B'].map(k=>`<button class="ch ${pick===k?'sel':''}" data-pick="${k}" ${(!active||b)?'disabled':''}><em>${k}</em><span>${k==='A'?'Gana '+esc(pretty(m.option_a)):k==='B'?'Gana '+esc(pretty(m.option_b)):'Empate'}</span><b>x${odd(o,k).toFixed(2)}</b><small>${Math.round(o[k]/total(o)*100)}% del bote</small></button>`).join('')}</div>${b?`<div class="receipt">Tu apuesta: <b>${money(b.amount)} · ${esc(label(m,b.pick))}</b></div>`:active?betzone(o):`<div class="notice">${ph==='soon'?'Todavía no ha abierto el mercado.':'La jornada ya ha comenzado. No se admiten nuevas apuestas.'}</div>`}<div class="pool"><span>${count(m)}/${state.profiles.length} han apostado</span><b>Bote ${money(total(o))}</b></div></section>`}function betzone(o){const u=me(),v=[25,50,100,250],ok=v.filter(x=>x<=u.balance);if(!ok.length)return'<div class="notice">No tienes florines suficientes para la apuesta mínima.</div>';if(!ok.includes(stake))stake=ok.includes(100)?100:ok.at(-1);return`<div class="betgrid"><div class="betbox"><div class="ttl">Elige tus florines</div><div class="stakes">${v.map(x=>`<button class="stake ${stake===x?'on':''}" data-stake="${x}" ${x>u.balance?'disabled':''}>${money(x)}</button>`).join('')}</div>${pick?`<div class="est"><span>Retorno estimado</span><b>${money(Math.round(stake*postOdd(o,pick,stake)))}</b></div>`:''}<button id="bet" class="primary" ${pick?'':'disabled'}>${pick?'REALIZAR APUESTA':'ELIGE A, X O B'}</button></div><div class="pot"><i>🏆</i><div><div class="ttl">Bote actual</div><b>${money(total(o))}</b></div><small>Se reparte entre los aciertos.</small></div></div>`}function rankPreview(){const r=rank().slice(0,3);return`<section class="sec"><div class="sect"><h3>♛ Ranking general</h3><button data-tab="rank">Ver completo ›</button></div><div class="podium">${r.map((p,i)=>`<div class="pod"><em>#${i+1}</em><span>${esc(pretty(p.display_name))}</span><b>${money(p.balance)}</b></div>`).join('')}</div></section>`}function rc(m){const ph=phase(m);return`<article class="rc ${m.status==='open'?'cur':''}"><div class="rt"><span>JORNADA ${m.jornada}</span><span>${fd(m.closes_at)}</span></div><h4>${esc(pretty(m.option_a))} <span style="color:var(--r)">VS</span> ${esc(pretty(m.option_b))}</h4><strong>${m.option_a_points||0} — ${m.option_b_points||0}</strong><div class="rr ${m.result?'':'pend'}">${m.result?'✓ RESULTADO: '+esc(label(m,m.result)):ph==='open'?'● APUESTAS ABIERTAS':ph==='closed'?'PENDIENTE DE RESOLUCIÓN':'ABRE 24H ANTES'}</div></article>`}function roundPreview(){const a=[...(state.markets||[])].sort((x,y)=>y.jornada-x.jornada).slice(0,3);return`<section class="sec"><div class="sect"><h3>◷ Historial de jornadas</h3><button data-tab="rounds">Ver todas ›</button></div><div class="rounds">${a.length?a.map(rc).join(''):'<div class="notice">La Jornada 5 será la primera registrada.</div>'}</div></section>`}function ranking(){return`<section class="panel"><div class="ph"><div class="eye">LA FLORA BETS</div><h2>Ranking general</h2></div><div class="rows">${rank().map((p,i)=>`<div class="row ${p.id===state.currentId?'me':''}"><span class="num">${i===0?'♛':i+1}</span><span class="nm"><b>${esc(pretty(p.display_name))}</b><small>${p.id===state.currentId?'TU POSICIÓN':'LA FLORA 26.27'}</small></span><strong>${money(p.balance)}</strong></div>`).join('')}</div></section>`}function rounds(){const a=[...(state.markets||[])].sort((x,y)=>y.jornada-x.jornada);return`<section class="panel"><div class="ph"><div class="eye">TEMPORADA 26.27</div><h2>Jornadas</h2></div><div class="rounds" style="padding:12px">${a.length?a.map(rc).join(''):'<div class="notice">Todavía no hay jornadas registradas.</div>'}</div></section>`}function history(){const a=(state.bets||[]).filter(b=>b.user_id===state.currentId),mk=id=>state.markets.find(m=>m.id===id);return`<section class="panel"><div class="ph"><div class="eye">TU TEMPORADA</div><h2>Mis apuestas</h2></div><div style="padding:0 12px">${a.length?a.map(b=>{const m=mk(b.market_id);return`<div class="hr"><span><b>Jornada ${m?.jornada||'—'} · ${esc(m?label(m,b.pick):b.pick)}</b><small>${money(b.amount)}</small></span><span class="status ${b.status}">${b.status==='won'?`GANADA<br>+${money(b.payout)}`:b.status==='lost'?'PERDIDA':'PENDIENTE'}</span></div>`}).join(''):'<div class="notice">Todavía no has apostado.</div>'}</div></section>`}function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;msg='';main()});document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{pick=x.dataset.pick;main()});document.querySelectorAll('[data-stake]').forEach(x=>x.onclick=()=>{stake=+x.dataset.stake;main()});out.onclick=async()=>{try{await rpc('lf_player_logout',{p_session_token:session})}catch{}session='';state=null;localStorage.removeItem(K2);render()};document.getElementById('bet')?.addEventListener('click',async()=>{const m=market();if(!confirm(`¿Confirmas ${money(stake)} a ${label(m,pick)}?`))return;try{await rpc('lf_place_bet',{p_session_token:session,p_market_id:m.id,p_pick:pick,p_amount:stake});msg='Apuesta confirmada.';pick='';state=await rpc('lf_get_state',{p_session_token:session})}catch(e){msg=e.message}main()})}function tick(){if(!state)return;const m=market();if(!m)return;const ph=phase(m);if(lastPhase&&ph!==lastPhase){lastPhase=ph;main();return}lastPhase=ph;const e=document.querySelector('.js-cd');if(e)e.textContent=cd(+e.dataset.t-Date.now())}function render(){if(!gate)return gateView();if(!session||!state)return loginView();main()}setInterval(tick,1000);start()})()
</script></body></html>
